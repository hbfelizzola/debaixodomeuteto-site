# Publica a pasta site/ no GitHub Pages.
# Por enquanto só roda manualmente (Actions → "Site" → Run workflow). Para publicar a cada push na main,
# descomente o bloco "push" abaixo depois que o Pages estiver configurado (veja README.md).
name: Site

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: ['site/**', '.github/workflows/site.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
